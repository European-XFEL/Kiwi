# run CI only on branches and tags
workflow:
  rules:
    - if: $CI_COMMIT_TAG
    - if: $CI_COMMIT_BRANCH

stages:
  - test

variables:
  NODE_ENV: test

# Global cache config: keyed by lockfile contents so changes invalidate cache.
cache:
  key:
    files:
      - yarn.lock
  paths:
    - node_modules/
    - .yarn
  policy: pull

.default_node_image: &node_image
  image: node:20

test:
  <<: *node_image
  stage: test
  before_script:
    - corepack enable
  script:
    - node -v
    - npm -v
    - yarn -v
    - yarn install --immutable
    - yarn cov --watchAll=false
