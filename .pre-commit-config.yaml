repos:

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-merge-conflict
      - id: check-yaml

  - repo: local
    hooks:
      - id: prettier
        name: prettier
        language: node
        entry: prettier --write
        additional_dependencies:
          - prettier@3.9.1
        files: \.(js|jsx|ts|tsx|json|css|scss|md)$
